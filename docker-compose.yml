# Local PostgreSQL + PostGIS for development.
#   docker compose up -d db
# The credentials below are LOCAL DEVELOPMENT ONLY. Never reuse them anywhere else.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: fullstack-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_pw
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
